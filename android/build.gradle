import groovy.json.JsonSlurper

buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion')
    ? rootProject.ext.get('kotlinVersion')
    : '2.0.21'

  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def packageJson = new JsonSlurper().parse(file('../package.json'))

def getExtOrDefault(name, defaultValue) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

group = 'com.viafoura.reactnative'
version = packageJson.version

android {
  namespace 'com.viafoura.reactnative'
  compileSdk getExtOrDefault('compileSdkVersion', 35)

  if (rootProject.hasProperty('ndkPath')) {
    ndkPath rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty('ndkVersion')) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    minSdk getExtOrDefault('minSdkVersion', 24)
    targetSdk getExtOrDefault('targetSdkVersion', 35)
    versionCode 1
    versionName packageJson.version
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.viafoura:android:2.1.12'
  implementation 'androidx.fragment:fragment-ktx:1.7.1'
}
