name: Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.19.4
  RN_VERSION: 0.81.5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The package is a classic React Native module, so it has to autolink in a bare
  # React Native app and in an Expo prebuild app. Both are smoke tested.
  android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [expo, bare]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Package module
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/viafoura-package
          npm pack --pack-destination /tmp/viafoura-package

      - name: Create ${{ matrix.app }} smoke app
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "expo" ]; then
            npx create-expo-app@latest /tmp/smoke --template blank-typescript --yes
            cd /tmp/smoke
            npm install /tmp/viafoura-package/*.tgz
            npx expo prebuild --platform android --non-interactive
          else
            npx @react-native-community/cli@latest init ViafouraSmoke \
              --directory /tmp/smoke --version "$RN_VERSION" --skip-install --skip-git-init
            cd /tmp/smoke
            npm install
            npm install /tmp/viafoura-package/*.tgz
          fi

      - name: Verify autolinking picked up the module
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "expo" ]; then
            CONFIG=$(node node_modules/expo/bin/autolinking react-native-config --platform android --json)
          else
            CONFIG=$(node node_modules/@react-native-community/cli/build/bin.js config --platform android)
          fi
          echo "$CONFIG" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const deps = JSON.parse(s).dependencies || {};
              if (!deps["@viafoura/sdk-react-native"]) {
                console.error("::error::@viafoura/sdk-react-native was not autolinked");
                process.exit(1);
              }
              console.log("autolinked OK");
            });
          '

      - name: Compile Android
        working-directory: /tmp/smoke/android
        run: ./gradlew assembleDebug --no-daemon

  ios-native:
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [expo, bare]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Package module
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/viafoura-package
          npm pack --pack-destination /tmp/viafoura-package

      - name: Create ${{ matrix.app }} smoke app
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "expo" ]; then
            npx create-expo-app@latest /tmp/smoke --template blank-typescript --yes
            cd /tmp/smoke
            npm install /tmp/viafoura-package/*.tgz
            npx expo prebuild --platform ios --non-interactive
          else
            npx @react-native-community/cli@latest init ViafouraSmoke \
              --directory /tmp/smoke --version "$RN_VERSION" --skip-install --skip-git-init
            cd /tmp/smoke
            npm install
            npm install /tmp/viafoura-package/*.tgz
          fi

      - name: Install pods
        working-directory: /tmp/smoke/ios
        # RCT_USE_RN_DEP makes CocoaPods use React Native's prebuilt dependency
        # artifacts. Built from source, fmt 11.0.2 (pinned by RCT-Folly) fails to
        # compile under Xcode 26. Expo prebuild already defaults to the artifacts.
        run: RCT_USE_RN_DEP=1 pod install --repo-update

      - name: Verify the module pod installed
        working-directory: /tmp/smoke/ios
        run: |
          set -euo pipefail
          if ! grep -qE '^  - Viafoura \(' Podfile.lock; then
            echo "::error::Viafoura pod is missing from Podfile.lock; autolinking failed."
            exit 1
          fi
          echo "Viafoura pod installed"

      - name: Compile iOS
        working-directory: /tmp/smoke/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME=Viafoura

          if ! xcodebuild -list -json -workspace "$WORKSPACE" | ruby -rjson -e 'exit JSON.parse(STDIN.read).dig("workspace", "schemes").include?(ARGV[0]) ? 0 : 1' "$SCHEME"; then
            echo "::error::Scheme '$SCHEME' not found in $WORKSPACE; the module pod did not install."
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
