name: Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.19.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The sample apps are the smoke test for both integration paths: the packed
  # tarball is installed into each of them in place of the file:../.. link, so
  # the compiled artifact is exactly what gets published.
  examples-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [bare, expo]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.app }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Package module
        run: |
          npm ci
          mkdir -p /tmp/viafoura-package
          npm pack --pack-destination /tmp/viafoura-package

      - name: Install example with the packed module
        working-directory: examples/${{ matrix.app }}
        run: |
          npm ci
          npm install --no-save /tmp/viafoura-package/*.tgz

      - name: Prebuild
        if: matrix.app == 'expo'
        working-directory: examples/expo
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Verify autolinking picked up the module
        working-directory: examples/${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "expo" ]; then
            CONFIG=$(node node_modules/expo/bin/autolinking react-native-config --platform android --json)
          else
            CONFIG=$(node node_modules/@react-native-community/cli/build/bin.js config --platform android)
          fi
          echo "$CONFIG" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const deps = JSON.parse(s).dependencies || {};
              if (!deps["@viafoura/sdk-react-native"]) {
                console.error("::error::@viafoura/sdk-react-native was not autolinked");
                process.exit(1);
              }
              console.log("autolinked OK");
            });
          '

      - name: Compile Android
        working-directory: examples/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

  examples-ios:
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bare
            workspace: ViafouraDemo.xcworkspace
            scheme: sdk
          - app: expo
            workspace: ViafouraExpoSampleApp.xcworkspace
            scheme: ViafouraExpoSampleApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.app }}/package-lock.json

      - name: Package module
        run: |
          npm ci
          mkdir -p /tmp/viafoura-package
          npm pack --pack-destination /tmp/viafoura-package

      - name: Install example with the packed module
        working-directory: examples/${{ matrix.app }}
        run: |
          npm ci
          npm install --no-save /tmp/viafoura-package/*.tgz

      - name: Prebuild
        if: matrix.app == 'expo'
        working-directory: examples/expo
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Install pods
        working-directory: examples/${{ matrix.app }}/ios
        # RCT_USE_RN_DEP makes CocoaPods use React Native's prebuilt dependency
        # artifacts. Built from source, fmt 11.0.2 (pinned by RCT-Folly) fails to
        # compile under Xcode 26. Expo prebuild already defaults to the artifacts.
        run: RCT_USE_RN_DEP=1 pod install --repo-update

      - name: Verify the module pod installed
        working-directory: examples/${{ matrix.app }}/ios
        run: |
          set -euo pipefail
          if ! grep -qE '^  - Viafoura \(' Podfile.lock; then
            echo "::error::Viafoura pod is missing from Podfile.lock; autolinking failed."
            exit 1
          fi
          echo "Viafoura pod installed"

      - name: Compile iOS
        working-directory: examples/${{ matrix.app }}/ios
        run: |
          xcodebuild \
            -workspace "${{ matrix.workspace }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
