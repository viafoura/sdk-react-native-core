name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Check published version
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view @viafoura/sdk-react-native@"$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Trigger slack Notification on success
        if: success() && steps.check.outputs.publish == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"username": "MartinBot", "icon_url": "https://ca.slack-edge.com/T02QDGWD2-U036M3Y2WER-7ec6a2bb5711-192", "text":"New React Native Core SDK version released:  *${{ steps.check.outputs.version }}*\n ", }' https://hooks.slack.com/services/$SLACK_WEBHOOK
